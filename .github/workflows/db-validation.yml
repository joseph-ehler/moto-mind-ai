name: Database Validation

on:
  pull_request:
    paths:
      - 'database/migrations/**'
      - 'supabase/migrations/**'

jobs:
  preflight:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run AI Preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "🔍 Running preflight validation..."
          npm run db ai:preflight -- --output preflight-result.json || true
      
      - name: Check preflight status
        run: |
          if [ ! -f preflight-result.json ]; then
            echo "❌ Preflight did not generate results"
            exit 1
          fi
          
          STATUS=$(jq -r '.status' preflight-result.json)
          
          if [ "$STATUS" = "blocked" ]; then
            echo "❌ Preflight BLOCKED"
            jq '.summary' preflight-result.json
            echo ""
            echo "Blockers:"
            jq -r '.lint_results.issues[] | select(.severity == "error") | "  • \(.message)"' preflight-result.json
            exit 1
          fi
          
          # Check if auto-fixes are available but not applied
          if jq -e '.actions[] | select(.type == "auto_fix_available")' preflight-result.json > /dev/null; then
            echo "⚠️  Auto-fixes available but not applied"
            jq -r '.actions[] | select(.type == "auto_fix_available") | .message' preflight-result.json
            echo ""
            jq -r '.actions[] | select(.type == "auto_fix_available") | .command' preflight-result.json
            exit 1
          fi
          
          echo "✅ Preflight passed!"
      
      - name: Upload preflight results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: preflight-results
          path: preflight-result.json
      
      - name: Comment on PR
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('preflight-result.json')) {
              return;
            }
            
            const results = JSON.parse(fs.readFileSync('preflight-result.json', 'utf8'));
            
            let body = '## ❌ Database Preflight Failed\n\n';
            body += `**Status:** ${results.status}\n\n`;
            body += `**Summary:** ${results.summary}\n\n`;
            
            if (results.lint_results && results.lint_results.blockers > 0) {
              body += `### Blockers (${results.lint_results.blockers})\n\n`;
              results.lint_results.issues
                .filter(i => i.severity === 'error')
                .slice(0, 5)
                .forEach(issue => {
                  body += `- ${issue.message}\n`;
                  if (issue.fix) {
                    body += `  \`\`\`sql\n  ${issue.fix}\n  \`\`\`\n`;
                  }
                });
            }
            
            if (results.actions && results.actions.length > 0) {
              body += '\n### Recommended Actions\n\n';
              results.actions.forEach((action, i) => {
                body += `${i + 1}. **${action.message}**\n`;
                if (action.command) {
                  body += `   \`${action.command}\`\n`;
                }
              });
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
